<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500" role="img" aria-labelledby="title desc">
<title id="title">Formula-Network Intelligence Architecture</title>
<desc id="desc">A visual map of the shared Framework, seven connected components, execution path, evaluation and maintenance feedback.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b91b0"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17243a}
    .title{font-size:36px;font-weight:700}.subtitle{font-size:19px;fill:#53647d}
    .card{fill:#f5f8fc;stroke:#8ba4c5;stroke-width:2;rx:20}
    .head{font-size:22px;font-weight:700}.body{font-size:17px;fill:#34445c}
    .framework{fill:#e6ddff;stroke:#7857bd;stroke-width:3}
    .runtime{fill:#e1f4e9;stroke:#398260;stroke-width:2}
    .feedback{fill:#fff0d9;stroke:#b77927;stroke-width:2}
    .line{fill:none;stroke:#7b91b0;stroke-width:3;marker-end:url(#arrow)}
    .link{fill:none;stroke:#9277c8;stroke-width:2.5;stroke-dasharray:8 7}
  </style>
</defs>
<rect width="1400" height="1500" fill="#ffffff" rx="24"/>
<text x="700" y="58" text-anchor="middle" class="title">Formula-Network Intelligence</text>
<text x="700" y="91" text-anchor="middle" class="subtitle">Connected components · shared relational foundation · feedback</text>

<rect x="475" y="125" width="450" height="78" rx="18" class="runtime"/>
<text x="700" y="157" text-anchor="middle" class="head">Input · observation · goal</text>
<text x="700" y="183" text-anchor="middle" class="body">Represent what is known and what is unknown</text>
<path d="M700 203 V235" class="line"/>

<rect x="465" y="238" width="470" height="84" rx="18" class="card"/>
<text x="700" y="271" text-anchor="middle" class="head">Context and state</text>
<text x="700" y="298" text-anchor="middle" class="body">Entities · relations · assumptions · evidence · time</text>
<path d="M700 322 V352" class="line"/>

<rect x="60" y="370" width="1280" height="475" rx="28" fill="#f8f6ff" stroke="#b7a4e4" stroke-width="2"/>
<text x="700" y="410" text-anchor="middle" class="head">Connected components — not a rigid sequence</text>

<rect x="95" y="445" width="365" height="112" class="card"/>
<text x="277" y="480" text-anchor="middle" class="head">Fundamental building blocks</text>
<text x="277" y="510" text-anchor="middle" class="body">Units · properties · states</text>
<text x="277" y="534" text-anchor="middle" class="body">Configurations · constraints</text>

<rect x="518" y="445" width="365" height="112" class="card"/>
<text x="700" y="480" text-anchor="middle" class="head">Formula library</text>
<text x="700" y="510" text-anchor="middle" class="body">Reusable typed operations</text>
<text x="700" y="534" text-anchor="middle" class="body">Inputs · outputs · dependencies</text>

<rect x="940" y="445" width="365" height="112" class="card"/>
<text x="1122" y="480" text-anchor="middle" class="head">Reasoning formulae</text>
<text x="1122" y="510" text-anchor="middle" class="body">Hypotheses · comparisons</text>
<text x="1122" y="534" text-anchor="middle" class="body">Derivations · candidate paths</text>

<rect x="95" y="590" width="365" height="105" class="card"/>
<text x="277" y="625" text-anchor="middle" class="head">Motivation control</text>
<text x="277" y="655" text-anchor="middle" class="body">Urgency · caution · curiosity</text>
<text x="277" y="678" text-anchor="middle" class="body">Sensitivity · exploration</text>

<ellipse cx="700" cy="641" rx="205" ry="68" class="framework"/>
<text x="700" y="625" text-anchor="middle" class="head">SHARED FRAMEWORK</text>
<text x="700" y="652" text-anchor="middle" class="body">Relations · difference · identity</text>
<text x="700" y="675" text-anchor="middle" class="body">Change · time · value · uncertainty</text>

<rect x="940" y="590" width="365" height="105" class="card"/>
<text x="1122" y="625" text-anchor="middle" class="head">Concentration engine</text>
<text x="1122" y="655" text-anchor="middle" class="body">Attention · routing · budgets</text>
<text x="1122" y="678" text-anchor="middle" class="body">Trace inspection · optimization</text>

<rect x="440" y="740" width="520" height="75" class="card"/>
<text x="700" y="771" text-anchor="middle" class="head">Output and action</text>
<text x="700" y="797" text-anchor="middle" class="body">Answers · structures · visualizations · permitted actions</text>

<path d="M460 500 H500" class="link"/><path d="M883 500 H920" class="link"/>
<path d="M277 557 V577" class="link"/><path d="M1122 557 V577" class="link"/>
<path d="M460 640 H485" class="link"/><path d="M915 640 H940" class="link"/>
<path d="M700 709 V732" class="link"/>
<path d="M935 280 H1210 V420" class="link"/>

<path d="M1122 695 V875 H700 V900" class="line"/>
<rect x="390" y="905" width="620" height="88" rx="18" class="runtime"/>
<text x="700" y="940" text-anchor="middle" class="head">Select paths → execute within budgets</text>
<text x="700" y="968" text-anchor="middle" class="body">Activate only relevant formulae and dependencies</text>
<path d="M700 993 V1020" class="line"/>

<rect x="390" y="1024" width="620" height="88" rx="18" class="feedback"/>
<text x="700" y="1059" text-anchor="middle" class="head">Evaluate result and uncertainty</text>
<text x="700" y="1087" text-anchor="middle" class="body">Compare with task goal, evidence, reliability and cost</text>
<path d="M700 1112 V1140" class="line"/>

<rect x="90" y="1145" width="550" height="100" rx="18" class="card"/>
<text x="365" y="1181" text-anchor="middle" class="head">Return typed output</text>
<text x="365" y="1210" text-anchor="middle" class="body">Or ask for information / abstain when needed</text>

<rect x="760" y="1145" width="550" height="100" rx="18" class="feedback"/>
<text x="1035" y="1181" text-anchor="middle" class="head">Maintenance and learning</text>
<text x="1035" y="1210" text-anchor="middle" class="body">Inspect traces · test bounded changes · rollback</text>
<path d="M510 1112 V1130 H365 V1145" class="line"/>
<path d="M890 1112 V1130 H1035 V1145" class="line"/>
<path d="M1035 1145 V1010 H1015" class="line"/>

<text x="700" y="1310" text-anchor="middle" class="head">Shared principle</text>
<text x="700" y="1344" text-anchor="middle" class="body">The Framework relates every component; it is not a final processing stage.</text>
<text x="700" y="1375" text-anchor="middle" class="body">This is a proposed research architecture, to be tested against measurable baselines.</text>
</svg>